   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://foiugwvndheatzznrrpl.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvaXVnd3ZuZGhlYXR6em5ycnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzE4MjUsImV4cCI6MjEwMTQwNzgyNX0.wr82Ybn61WegKzwg83-wUor95UGpaV2BBR3uoN--C68";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


async function loadUsername() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        return;

    }


    const {
        data: profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", user.id)
            .maybeSingle();


    if (error) {

        console.error(
            "Could not load username:",
            error
        );

        return;

    }


    if (profile) {

        document.getElementById(
            "usernameDisplay"
        ).textContent =
            "@" + profile.username;

    }

}


loadUsername();

</script>
